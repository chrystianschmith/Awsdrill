version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Versões maiores (ex.: TypeScript 7, ESLint 10) são migradas à mão, não por PR automático.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
